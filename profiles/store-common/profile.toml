name = "store-common"
title = "Database"
kind = "fragment"
summary = "Where the install's database is: a file on this computer, or the lab's PostgreSQL server"
version = 1

[[questions]]
id = "data_source"
prompt = "Where is the data?"
type = "choice"
choices = ["local", "server"]
labels = ["On this computer (a new database in the install folder)", "My lab's database server (PostgreSQL)"]
default = "local"
group = "Data"
help = "A database on this computer starts empty and is yours alone; a server database is shared with your lab."

[[questions]]
id = "db_host"
prompt = "Database server"
type = "host"
default = "localhost"
group = "Data"
when = "data_source == \"server\""

[[questions]]
id = "db_port"
prompt = "Port"
type = "port"
default = 5432
group = "Data"
when = "data_source == \"server\""

[[questions]]
id = "db_name"
prompt = "Database"
type = "string"
default = "pychron"
group = "Data"
when = "data_source == \"server\""

[[questions]]
id = "db_user"
prompt = "User"
type = "string"
default = "pychron"
group = "Data"
when = "data_source == \"server\""

[[questions]]
id = "db_password"
prompt = "Password"
type = "secret"
group = "Data"
when = "data_source == \"server\""
help = "Kept in .pychron/credentials.toml in this folder (owner-readable), never in the site config."

[[files]]
template = "credentials.toml"
to = ".pychron/credentials.toml"
when = "data_source == \"server\""
secret = true
