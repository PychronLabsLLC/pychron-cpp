# Example queue (written by pychron setup):
#   elctl --install {{ install_name }} exp run experiment.toml
# Three air shots between two blanks.

[queue]
name = "first-queue"
mass_spectrometer = "{{ family }}"
username = "pychron"

[queue.delays]
before_analyses = 5
between_analyses = 10
after_blank = 10

[[runs]]
identifier = "ba"
extraction = { script = "sim_blank", duration = 30 }
measurement = { plan = "multicollect" }
post_measurement = "sim_pump"
sample = { sample = "blank_air", material = "blank", project = "references" }

[[runs]]
identifier = "a"
extraction = { script = "sim_air", duration = 30 }
measurement = { plan = "multicollect" }
post_measurement = "sim_pump"
sample = { sample = "air", material = "air", project = "references" }

[[runs]]
identifier = "a"
extraction = { script = "sim_air", duration = 30 }
measurement = { plan = "multicollect" }
post_measurement = "sim_pump"
sample = { sample = "air", material = "air", project = "references" }

[[runs]]
identifier = "a"
extraction = { script = "sim_air", duration = 30 }
measurement = { plan = "multicollect" }
post_measurement = "sim_pump"
sample = { sample = "air", material = "air", project = "references" }

[[runs]]
identifier = "ba"
extraction = { script = "sim_blank", duration = 30 }
measurement = { plan = "multicollect" }
post_measurement = "sim_pump"
sample = { sample = "blank_air", material = "blank", project = "references" }
