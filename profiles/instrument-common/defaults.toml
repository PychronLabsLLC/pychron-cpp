# What a new run starts with in the run factory, per analysis type
# (written by pychron setup). The sample tables name the reference samples
# of seed.toml, so a new blank or air is recorded as one of them.

[unknown."*"]
template = "multicollect"
script = "sim_extract"
post_measurement = "sim_pump"

[unknown."*".extraction]
units = "w"
value = 5
duration = 10

[blank_unknown."*"]
template = "multicollect"
script = "sim_extract"
post_measurement = "sim_pump"

[blank_unknown."*".extraction]
duration = 2

[blank_unknown."*".sample]
sample = "blank_unknown"
material = "blank"
project = "references"

[blank_air."*"]
template = "multicollect"
script = "sim_extract"
post_measurement = "sim_pump"

[blank_air."*".extraction]
duration = 2

[blank_air."*".sample]
sample = "blank_air"
material = "blank"
project = "references"

[blank_cocktail."*"]
