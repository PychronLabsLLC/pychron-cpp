[project]
name = "spec-router"
version = "0.1.0"
description = "Split a design spec into work units with TypeSafe judgments and delegate each to a headless Claude Code agent."
requires-python = ">=3.11"
dependencies = ["typesafe-sdk>=0.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
spec-router = "spec_router.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["spec_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
