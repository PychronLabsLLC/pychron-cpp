# Work units for the instrument-control spec. Mirrors spec section 9.4.
# Dependency and wave structure is a stated design rule, so it lives in code
# (here), not in a model judgment. Jev decides which spec sections each unit
# needs, how large each unit is, and whether an agent's report is credible.

[[unit]]
id = "core"
wave = 1
layer = "core"
goal = "libs/core: Result/Error, injected Clock, Scheduler (periodic/one-shot/watchdog, per-job non-overlap), SignalBus (typed pub/sub), Logger, TOML config loader + validation with file:line:field errors."
targets = ["libs/core", "tests/core", "CMakeLists.txt", "CMakePresets.json", "vcpkg.json", "cmake"]

[[unit]]
id = "transport"
wave = 2
layer = "transport"
depends = ["core"]
goal = "libs/transport: Transport interface with per-instance worker + FIFO queue, ReadSpec, Health; SimTransport (scripted/replay/hook + fault injection); SerialTransport and TcpTransport on standalone asio; TraceRecorder decorator."
targets = ["libs/transport", "tests/transport"]

[[unit]]
id = "device_kit"
wave = 3
layer = "devices"
depends = ["transport"]
goal = "libs/devices foundation shared by every driver: Device base (identity + health), capability interfaces (IPressureGauge, IValveActuator, IScannable), Sample/ValveState types, DriverRegistry with REGISTER_DRIVER and declared config keys, codec conventions doc + empty libs/codecs target. No vendor code."
targets = ["libs/devices", "libs/codecs", "tests/devices"]

[[unit]]
id = "pfeiffer_maxigauge"
wave = 4
layer = "devices"
depends = ["device_kit"]
goal = "Pfeiffer MaxiGauge: codec (PR/ENQ/ACK framing, decode), driver implementing IPressureGauge + IScannable, registry entry, scripted + replay tests, SimSystem hook contract."
targets = ["libs/codecs", "libs/devices", "tests/codecs", "tests/devices"]

[[unit]]
id = "proxr_relay"
wave = 4
layer = "devices"
depends = ["device_kit"]
goal = "NCD ProXR relay: codec, driver implementing IValveActuator, registry entry, scripted + replay tests, SimSystem hook contract."
targets = ["libs/codecs", "libs/devices", "tests/codecs", "tests/devices"]

[[unit]]
id = "switch_manager"
wave = 5
layer = "systems"
depends = ["proxr_relay"]
goal = "libs/systems SwitchManager: valves/manual valves/switches from config, actuate() with software lock, owner, negative + positive interlocks, settle, readback, SignalBus events; property-style interlock tests."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "gauge_scanner"
wave = 5
layer = "systems"
depends = ["pfeiffer_maxigauge"]
goal = "libs/systems GaugeScanner: register gauges with Scheduler, publish PressureSample, evaluate alarm_high/alarm_low, publish Alarm."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "canvas_network"
wave = 5
layer = "systems"
depends = ["core"]
goal = "libs/systems canvas model: canvas.toml loader (Qt-free geometry structs), cross-validation against system config, NetworkGraph with connected_volumes(valve_states)."
targets = ["libs/systems", "tests/systems", "configs/examples"]

[[unit]]
id = "elctl"
wave = 6
layer = "apps"
depends = ["switch_manager", "gauge_scanner", "canvas_network"]
goal = "apps/elctl CLI: validate, canvas-check, list-drivers, probe, list, state, open/close, read, scan --for, trace on|off, sim REPL."
targets = ["apps/elctl"]

[[unit]]
id = "extraction_line_facade"
wave = 7
layer = "systems"
depends = ["elctl"]
goal = "ExtractionLine facade: load both configs, build transports -> drivers -> managers, start()/stop(), Snapshot event, SimSystem (libs/sim) stateful model, end-to-end integration test under kind=sim."
targets = ["libs/systems", "libs/sim", "tests/integration"]

[[unit]]
id = "qt_ui"
preset = "dev-ui"
wave = 8
layer = "ui"
depends = ["extraction_line_facade"]
goal = "apps/pychron-ui (configure with `cmake --preset dev-ui`; Qt 6.12 is at $HOME/Qt/6.12.0/macos, components Widgets+Charts+Test available): CoreBridge (SignalBus -> Qt main thread, command executor thread), QGraphicsView canvas items, LogDock, AlarmDock, HealthBar; Qt Test smoke under BUILD_UI."
targets = ["apps/pychron-ui", "tests/ui"]

[[unit]]
id = "gp_microion"
wave = 8
layer = "devices"
depends = ["extraction_line_facade"]
goal = "Granville-Phillips Micro-Ion gauge: codec, driver, registry, tests, sim hook. Proves IPressureGauge is vendor-blind."
targets = ["libs/codecs", "libs/devices", "tests/codecs", "tests/devices"]

[[unit]]
id = "hardware_bringup"
wave = 9
layer = "manual"
manual = true
depends = ["qt_ui", "gp_microion"]
goal = "Lab bring-up: elctl probe on real hardware, capture traces, commit under tests/traces/. Never delegated to an agent."
targets = ["tests/traces"]

# =====================================================================
# Spectrometer control  (docs/superpowers/specs/2026-09-29-spectrometer-control-design.md)
# Waves continue after the extraction-line M1 waves. hardware_bringup (wave 9)
# is manual and nothing depends on it.
# =====================================================================

[[unit]]
id = "spec_roles"
wave = 10
layer = "devices"
depends = ["device_kit"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "libs/devices/spectrometer: role interfaces IMassPositioner, IBeamSource, IIntensityAcquirer, IDetectorControl, IBeamBlank; Frame, Readback, ParamSpec/ParamId (+Custom), Limits, Caps; canonical SourceParam registry; DetectorSet model + DetectorState event types. Headers, minimal .cpp, contract tests, conformance suite header (tests/devices/spectrometer/conformance.hpp)."
targets = ["libs/devices", "tests/devices"]

[[unit]]
id = "spec_config"
wave = 10
layer = "systems"
depends = ["core"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "spectrometer.toml schema + loader + validation (section 7): transports/drivers with roles, [magnet], [source], [acquisition], [detector_control], [[detectors]], tables/profiles directory layout, molecular_weights.toml; assembler validation rules as pure functions over the parsed config with one failing fixture per rule; two example configs (sim-integrated, sim-legacy)."
targets = ["libs/systems", "tests/systems", "configs/examples"]

[[unit]]
id = "field_table"
wave = 10
layer = "systems"
depends = ["core"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "FieldTable (pure): control points per detector, fit kinds discrete/linear/quadratic/cubic, value_for/mass_for (bracketed inverse), update with propagate, Config error on discrete miss; FieldTableStore with versioned tables/<name>/<timestamp>.toml + current pointer + restore; MolecularWeights table; pychron mftable.csv reader for the importer."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "exp_model"
wave = 10
layer = "experiment"
depends = ["core"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "libs/experiment/model: RunIdentity/AnalysisType (identifiers.toml driven), ExtractionSpec, MeasurementRef, RunSpec, QueueSpec, Delays, Overlap, SampleInfo; alias normalization; per-analysis-type field rules; position-range parsing; identifier regexes. Pure data + validation, no I/O beyond identifiers.toml."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "fits"
wave = 10
layer = "reduction"
depends = ["core"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "libs/reduction/fits (pure): FitSpec, fit(series, spec) -> Intercept for average/linear/parabolic/cubic/exponential/custom_poly with sem/sd errors and iterative outlier filtering; regression fixtures under tests/data/series with expected intercepts (port pychron algorithms; document any tolerance)."
targets = ["libs/reduction", "tests/reduction", "tests/data"]

[[unit]]
id = "acquisition_engine"
wave = 11
layer = "systems"
depends = ["spec_roles"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "AcquisitionEngine (section 3): one Scheduler job per acquirer; integrated pass-through; host integration binning with mean/sigma/n, dead-time correction, shared bin epoch; multi-acquirer merge by timestamp with nullopt for missing channels; Reading + IntensityReading event + IntensityStream (bounded queue, next(timeout)); acquire(n|duration) with trigger(); stale-frame guard; timeout -> Alarm; saturation flag. Tests with fake acquirers and ManualClock."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "sim_beam"
wave = 11
layer = "sim"
depends = ["spec_roles"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "libs/sim/spectrometer: BeamModel (section 8.1) and the five sim drivers sim_integrated, sim_dac_positioner, sim_adc_bank, sim_pulse_counter, sim_hv_supply, all bound to one BeamModel, registered in DriverRegistry; deterministic RNG + injected Clock; tests that peaks, HV scaling, deflection shift, saturation and protection flags behave as specified."
targets = ["libs/sim", "tests/sim"]

[[unit]]
id = "queue_file"
wave = 11
layer = "experiment"
depends = ["exp_model"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "experiment.toml load/validate/dump round-trip; ExperimentQueue edit ops (move/copy/repeat block/randomize/group by extraction/toggle skip/end-after); frequency expansion at edit time; queue-level validation collecting diagnostics (references to plans/scripts/conditionals are checked via injected resolver interfaces)."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "run_factory"
wave = 11
layer = "experiment"
depends = ["exp_model"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "RunFactory as pure functions: defaults.toml per (analysis_type, extract_device), block templates, position-range expansion, aliquot/step increment helpers, special-run insertion helpers. No UI."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "conditionals"
wave = 11
layer = "experiment"
depends = ["exp_model"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Conditionals (section 7): grammar parser to AST, typed MetricContext interface, evaluator with window/$NAME/ntrips/frequency/start, kinds and enum actions, level merge with disable, evaluation order, Trip events; TOML load; parser round-trip on pychron conditionals.rst examples; validation error for series-vs-scalar without reducer."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "analysis_record"
wave = 11
layer = "experiment"
depends = ["exp_model", "fits"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "AnalysisRecord v1 (section 8.3) types, RecordBuilder with per-phase completeness checks, deterministic JSON/TOML serialization + parse, record sha, schema version field and bump test."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "spectrometer_core"
wave = 12
layer = "systems"
depends = ["spec_config", "field_table", "acquisition_engine", "sim_beam"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Spectrometer facade + SpectrometerAssembler (section 2.2, 7.3): role binding from config, DetectorSet runtime state, position pipeline with corrections + exact uncorrect, move protocol with protect/blank/AF-demag/settle and failure-safe unprotect, position_hv, with_table scope, snapshot() -> SpectrometerState (content hash), MagnetMoved/DetectorState events. Integration test against both sim example configs."
targets = ["libs/systems", "tests/systems", "tests/integration"]

[[unit]]
id = "plan_schema"
wave = 12
layer = "experiment"
depends = ["exp_model", "conditionals"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "MeasurementPlan schema (section 4.1) with the unified hop model ([main] cycles + [[main.hops]]; multicollect = one hop, one cycle; reference-detector / explicit position rule; baseline hops; detectors.exclude): TOML parse + validation (one failing fixture per rule), '@' alias resolution against injected extraction-line/spectrometer resolvers, parameters.expose override enforcement incl. indexed paths and {path,label} entries, duration arithmetic with skipped settles, effective-plan rendering (template + overrides -> TOML text) for the record."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "extraction_device_ifaces"
wave = 12
layer = "devices"
depends = ["switch_manager"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Typed extraction-device interfaces for the script host (section 6): IExtractionDevice plus optional ILaserDevice, IFurnaceDevice, IStage, IPatternRunner, IPipetteService, ICryo, IMotorService, IImaging, IPressureService, IValveService adapter over SwitchManager; capability query; SimExtractionDevice (power -> temperature -> gas release hook); conformance suite for device implementations."
targets = ["libs/devices", "libs/sim", "tests/devices"]

[[unit]]
id = "legacy_kit"
wave = 13
layer = "devices"
depends = ["spectrometer_core"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Legacy split-system role drivers: dac_positioner (write-only DAC with cached readback over a generic DAC transport interface), adc_bank (raw sampled IIntensityAcquirer over Modbus/serial ADC codec), pulse_counter (count frames), serial_hv (IBeamSource with HV only) including a MAP-215 style serial magnet codec ('B{range}.' / 'W{v}.'); all pass the conformance suite; sim-legacy example config drives them end to end."
targets = ["libs/codecs", "libs/devices", "tests/codecs", "tests/devices"]

[[unit]]
id = "jobs_framework"
wave = 13
layer = "systems"
depends = ["spectrometer_core"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "libs/systems/jobs: Job/JobSpec/JobRunner (queue depth 1 per spectrometer, Interlock error when busy, cancel, progress events, before/after SpectrometerState snapshots) and the shared Sweep runner over magnet/HV/param/CDD axes with settle and bidirectional options."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "scripting_host"
wave = 13
layer = "scripting"
depends = ["extraction_device_ifaces"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "libs/scripting: embedded CPython via pybind11 (PYCHRON_SCRIPTING option with stub fallback), per-execution isolated namespace, full pyscript vocabulary bound to the typed interfaces, read-only context globals + opt.<key>, '#! pychron:' header parsing, static check (unknown command/arity/capability/valve name), estimate() with DurationAccumulator, CancelToken -> ScriptCancelled with finally semantics, abort interrupt, restricted builtins/import allowlist, gosub; same host for extraction/post_eq/post_meas/measurement hooks. Tests use the real interpreter and example scripts."
targets = ["libs/scripting", "tests/scripting", "vcpkg.json", "cmake"]

[[unit]]
id = "peak_center"
wave = 14
layer = "systems"
depends = ["jobs_framework"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Peak center job: pure find_peak_center(points, percent, min_height) -> PeakShape with resolution/resolving power (port pychron peak_detection with fixture scans under tests/data/scans), runner with start positioning, signal-settle wait, retry with scaled window, uncorrect + FieldTable::update + reposition, PeakCenterDone event with points retained on failure."
targets = ["libs/systems", "tests/systems", "tests/data"]
references = ["~/Programming/pychron/pychron"]

[[unit]]
id = "hv_sweep"
wave = 14
layer = "systems"
depends = ["jobs_framework"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "HV (accelerating voltage) sweep job reusing the peak fit; optional HV table writeback; tests on BeamModel."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "profiles_apply_verify"
wave = 14
layer = "systems"
depends = ["spectrometer_core"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "SpectrometerProfile (profiles/<name>.toml): desired source params, per-detector deflection/gain, CDD voltage, magnet settings, tolerances; Spectrometer::apply with writable-only filtering, generic Ramper for ramped params, verify -> VerifyReport; detector control ops guarded by caps. ALSO (carried over from spectrometer_core): the saturation -> protect policy of spec section 3.2 -- Spectrometer subscribes to IntensityReading, protects a detector whose reading is flagged saturated when it has protection config and IDetectorControl has the protect cap, publishes an Alarm, and never unprotects automatically; tests on BeamModel with an unprotected counter under a large beam."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "collector"
wave = 14
layer = "experiment"
depends = ["analysis_record", "acquisition_engine"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Collector (section 8.1): CollectionSpec, Series[iso,det,kind] keyed for multicollect and peak hop, per-reading conditional evaluation hook, SeriesUpdated events, set_target, truncate/cancel via token, RunData output."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "persister_boundary"
wave = 14
layer = "experiment"
depends = ["analysis_record"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "IAnalysisPersister interface (next_aliquot, begin_run, save_extraction, save_analysis, save_artifact, flush), FilePersister records directory, spool-first SavePipeline with Scheduler hand-off, retry and startup recovery; AliquotAllocator. No DB or git."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "coincidence"
wave = 15
layer = "systems"
depends = ["peak_center"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Coincidence job: peak-center reference then each active detector on the same isotope, convert deltas to deflection proposals via deflection.per_volt with clamp; separate explicit apply_deflections."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "deflection_cal"
wave = 15
layer = "systems"
depends = ["peak_center"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Deflection calibration job: sweep a detector's deflection at fixed magnet, peak fit, linear slope -> dac_per_volt; optional write to config-backed detector settings."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "cdd_scan"
wave = 15
layer = "systems"
depends = ["peak_center"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "CDD operating-voltage scan: Sweep over cdd_voltage on a counter at fixed isotope; pure plateau detection returning start/end/recommended; tests on synthetic and fixture plateaus."
targets = ["libs/systems", "tests/systems", "tests/data"]

[[unit]]
id = "ic_table_gen"
wave = 15
layer = "systems"
depends = ["peak_center"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "IC / peak-hop table generation: for a list of (isotope, detector) pairs run peak center under with_table(name) and write a named versioned field table."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "rise_rate"
wave = 15
layer = "systems"
depends = ["peak_center"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
goal = "Rise-rate / sensitivity job: acquire(n) at fixed position, linear slope per detector, result event."
targets = ["libs/systems", "tests/systems"]

[[unit]]
id = "run_state_machine"
wave = 15
layer = "experiment"
depends = ["collector", "scripting_host", "persister_boundary"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Run state machine + phases (section 3.1): Run::advance with typed events and RunStateChanged; IPhase objects Prepare/Extract/Equilibrate/Measure(placeholder hook to engine)/PostMeasure/Save; RunContext; CancelToken modes cancel/abort/truncate{quick}; post-measure failure still saves; save failure -> Failed(save_error) with spool. Every legal and illegal transition tested."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "measurement_engine"
wave = 15
layer = "experiment"
depends = ["plan_schema", "collector", "peak_center"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "MeasurementEngine (section 4.2): block sequence over spectrometer primitives and extraction-line valves; equilibrate||sniff timing with OverlapReady; a single HopRunner for main (cycles x hops, move+settle skipped when already positioned), sniff and baselines -- no separate multicollect path; baseline/peak-center before/after; time-zero policies; truncate scaling; hook entry points with typed MeasurementAPI; typed progress events. ALSO (carried over from plan_schema): the adapters from the loaded extraction_line.toml [aliases] and spectrometer.toml detector config to plan_schema's IAliasResolver / ISpectrometerCatalog, with a test that the shipped example configs resolve an example plan. Tests on BeamModel + SimSystem."
targets = ["libs/experiment", "tests/experiment"]
references = ["~/Programming/pychron/pychron"]

[[unit]]
id = "executor"
wave = 16
layer = "experiment"
depends = ["run_state_machine", "measurement_engine"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Executor (section 3.2-3.3): state machine, queue loop with IPreRunCheck plugins, delay policy, serial and overlapped execution with Resource exclusivity, OverlapReady/min_pump_time waits, stop/cancel/abort/truncate, end_after, queue conditional actions, scheduled start/stop, executor_state.json persistence and resume."
targets = ["libs/experiment", "tests/experiment"]

[[unit]]
id = "whole_lab_sim"
wave = 16
layer = "sim"
depends = ["sim_beam", "extraction_line_facade", "extraction_device_ifaces"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
goal = "Whole-lab simulation: compose SimSystem + BeamModel + SimExtractionDevice so released gas reaches the beam model when the inlet opens; deterministic clock; fast-clock runner; example lab config under configs/examples."
targets = ["libs/sim", "tests/sim", "configs/examples"]

[[unit]]
id = "spec_importer"
wave = 16
layer = "tooling"
depends = ["spec_config", "field_table"]
spec = "docs/superpowers/specs/2026-09-29-spectrometer-control-design.md"
