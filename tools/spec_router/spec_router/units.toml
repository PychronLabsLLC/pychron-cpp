[[unit]]
id = "exp_ui"
preset = "dev-ui"
wave = 19
layer = "ui"
depends = ["spec_ui_tuning", "elctl_exp", "template_library"]
spec = "docs/superpowers/specs/2026-09-29-experiment-system-design.md"
