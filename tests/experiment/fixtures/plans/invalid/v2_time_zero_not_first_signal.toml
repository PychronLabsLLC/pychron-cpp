# expect: time_zero belongs on the first after_inlet signal segment
[plan]
name = "t"
instrument_family = "thermo_argus"
analysis_types = ["unknown"]
[detectors]
reference = "H1"
[[segment]]
kind = "signal"
[[segment.positions]]
collect = { Ar40 = "H1" }
counts = 10
[[segment]]
kind = "signal"
time_zero = "on_inlet_close"
[[segment.positions]]
collect = { Ar39 = "H1" }
counts = 10
