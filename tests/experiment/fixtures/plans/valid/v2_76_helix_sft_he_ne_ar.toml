# Worked plan §7.6 of docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md,
# verbatim below the [plan] and [equilibration] tables (taken from multicollect.toml).

[plan]
name = "v2_76_helix_sft_he_ne_ar"
instrument_family = "thermo_helix_sft"
analysis_types = ["unknown"]

[equilibration]
inlet = "@valves.inlet"
outlet = "@valves.outlet"
time_s = "@extraction.eqtime"
inlet_delay_s = 3
close_inlet = true

[[gas]]
name = "He"
inlet = "@valves.he_inlet"
outlet = "@valves.outlet"
equilibration = { time_s = 20 }
time_zero = "on_inlet_close"
[[gas.segment]]
kind = "signal"
integration_s = 1
[[gas.segment.positions]]
collect = { He4 = "Faraday", He3 = "SEM" }
counts = 200
[[gas.segment]]
kind = "baseline"
when = "after_main"
[[gas.segment.positions]]
collect = { He4 = "Faraday", He3 = "SEM" }
at = { mass = 3.5, detector = "SEM" }
counts = 30

[[gas]]
name = "Ne"
inlet = "@valves.ne_inlet"
outlet = "@valves.outlet"
equilibration = { time_s = 30 }
[[gas.segment]]
kind = "signal"
cycles = 10
integration_s = 2
[[gas.segment.positions]]
collect = { Ne20 = "SEM" }
counts = 5
settle_s = 4
[[gas.segment.positions]]
collect = { Ne21 = "SEM" }
counts = 8
settle_s = 4
[[gas.segment.positions]]
collect = { Ne22 = "SEM" }
counts = 5
settle_s = 4
[[gas.segment.positions]]
collect = { Ar40 = "SEM" }     # Ar40++ correction on Ne20
counts = 3
settle_s = 4
[[gas.segment.positions]]
collect = { CO2 = "SEM" }      # mass 44, CO2++ on Ne22
counts = 3
settle_s = 4

[[gas]]
name = "Ar"
inlet = "@valves.ar_inlet"
outlet = "@valves.outlet"
[[gas.segment]]
kind = "signal"
cycles = 8
[[gas.segment.positions]]
collect = { Ar40 = "Faraday" }
counts = 5
[[gas.segment.positions]]
collect = { Ar39 = "SEM" }
counts = 5
[[gas.segment.positions]]
collect = { Ar38 = "SEM" }
counts = 5
[[gas.segment.positions]]
collect = { Ar37 = "SEM" }
counts = 8
[[gas.segment.positions]]
collect = { Ar36 = "SEM" }
counts = 8
