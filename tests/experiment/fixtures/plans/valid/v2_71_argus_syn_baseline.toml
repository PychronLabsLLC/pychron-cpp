# Worked plan §7.1 of docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md,
# verbatim below the [plan] and [equilibration] tables (taken from multicollect.toml).

[plan]
name = "v2_71_argus_syn_baseline"
instrument_family = "thermo_argus"
analysis_types = ["unknown"]

[equilibration]
inlet = "@valves.inlet"
outlet = "@valves.outlet"
time_s = "@extraction.eqtime"
inlet_delay_s = 3
close_inlet = true

[detectors]
reference = "H1"

[[segment]]
kind = "baseline"
when = "during_extraction"
integration_s = 1
[[segment.positions]]
collect = { Ar40 = "H1", Ar39 = "AX", Ar38 = "L1", Ar37 = "L2", Ar36 = "CDD" }
at = { mass = 34.2, detector = "H1" }
counts = 120
settle_s = 20

[[segment]]
kind = "signal"
integration_s = 1
time_zero = "on_inlet_close"
[[segment.positions]]
collect = { Ar40 = "H1", Ar39 = "AX", Ar38 = "L1", Ar37 = "L2", Ar36 = "CDD" }
counts = 400

[[segment]]
kind = "peak_center"
when = "after_run"
peak_center = { label = "Ar40", detector = "H1", extra_detectors = ["AX", "L2", "CDD"] }

[baseline.modifier.CDD]
variable = "Ar40+Ar39"
model = "baseline_model.csv"
error = "counting_statistics"
