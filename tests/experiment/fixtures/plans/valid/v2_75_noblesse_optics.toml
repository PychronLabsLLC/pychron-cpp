# Worked plan §7.5 of docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md,
# verbatim below the [plan] and [equilibration] tables (taken from multicollect.toml).

[plan]
name = "v2_75_noblesse_optics"
instrument_family = "nu_noblesse"
analysis_types = ["unknown"]

[equilibration]
inlet = "@valves.inlet"
outlet = "@valves.outlet"
time_s = "@extraction.eqtime"
inlet_delay_s = 3
close_inlet = true

[[segment]]
kind = "signal"
cycles = 15
[[segment.positions]]
collect = { Ar40 = "F0", Ar38 = "IC1", Ar36 = "IC2" }
optics = "ar_config_a"        # zoom, source tune, deflector A = -880 V
counts = 10
settle_s = 5
integration_s = 1
[[segment.positions]]
collect = { Ar39 = "IC0", Ar37 = "IC1" }
optics = "ar_config_b"
counts = 10
settle_s = 5
integration_s = 2
