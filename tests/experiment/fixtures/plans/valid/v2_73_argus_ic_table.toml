# Worked plan §7.3 of docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md,
# verbatim below the [plan] and [equilibration] tables (taken from multicollect.toml).

[plan]
name = "v2_73_argus_ic_table"
instrument_family = "thermo_argus"
analysis_types = ["unknown"]

[equilibration]
inlet = "@valves.inlet"
outlet = "@valves.outlet"
time_s = "@extraction.eqtime"
inlet_delay_s = 3
close_inlet = true

[[segment]]
kind = "set"
when = "before_inlet"
set = { deflection = { CDD = 2000 } }

[[segment]]
kind = "peak_center"
when = "before_inlet"
peak_center = { label = "Ar40", detectors = ["H1", "AX", "L2"], write_table = "ic_run" }

[[segment]]
kind = "signal"
cycles = 6
integration_s = 1
table = "ic_run"
[[segment.positions]]
collect = { Ar40 = "H2" }
counts = 10
settle_s = 20            # 10^13 ohm cup
[[segment.positions]]
collect = { Ar40 = "H1" }
counts = 10
settle_s = 6
[[segment.positions]]
collect = { Ar40 = "AX" }
counts = 10
settle_s = 6
[[segment.positions]]
collect = { Ar40 = "L1" }
counts = 10
settle_s = 20
[[segment.positions]]
collect = { Ar40 = "L2" }
counts = 10
settle_s = 6

[[segment]]
kind = "time_zero"
time_zero = "now"

[[segment]]
kind = "baseline"
when = "after_main"
[[segment.positions]]
collect = [ { label = "Ar40", detector = "H2" }, { label = "Ar40", detector = "H1" },
            { label = "Ar40", detector = "AX" }, { label = "Ar40", detector = "L1" },
            { label = "Ar40", detector = "L2" } ]
at = { mass = 39.5, detector = "H1" }
counts = 60
settle_s = 20
