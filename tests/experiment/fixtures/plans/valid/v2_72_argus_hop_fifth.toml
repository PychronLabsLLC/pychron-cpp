# Worked plan §7.2 of docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md,
# verbatim below the [plan] and [equilibration] tables (taken from multicollect.toml).

[plan]
name = "v2_72_argus_hop_fifth"
instrument_family = "thermo_argus"
analysis_types = ["unknown"]

[equilibration]
inlet = "@valves.inlet"
outlet = "@valves.outlet"
time_s = "@extraction.eqtime"
inlet_delay_s = 3
close_inlet = true

[[segment]]
kind = "signal"
cycles = 20
integration_s = 1
[[segment.positions]]
collect = [
  { label = "Ar40", detector = "H1" }, { label = "Ar41", detector = "H2" },
  { label = "Ar38", detector = "L1" }, { label = "Ar37", detector = "L2" },
  { label = "Ar36", detector = "CDD", deflection = 110 } ]
counts = 15
settle_s = 6
[[segment.positions]]
collect = { Ar39 = "CDD" }
counts = 15
settle_s = 5
[[segment.positions]]
collect = { mass35 = "CDD" }
at = { mass = 35.0, detector = "CDD" }
counts = 8
settle_s = 3

[[segment]]
kind = "baseline"
when = "after_main"
[[segment.positions]]
collect = { Ar40 = "H1", Ar41 = "H2", Ar38 = "L1", Ar37 = "L2", Ar36 = "CDD" }
at = { mass = 34.2, detector = "H1" }
counts = 120
settle_s = 20
