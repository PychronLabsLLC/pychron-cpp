# A simulated Helix SFT for worked plan 7.6 of the measurement plan v2 spec
# (docs/superpowers/specs/2026-10-05-measurement-plan-v2-design.md): one
# Faraday and one SEM, helium, neon and argon on one field table. Read by
# MeasurementSimV2Worked in tests/integration/test_measurement_sim.cpp.

[system]
name = "sim-helix-sft"
reference_detector = "Faraday"
integration_time_s = 1.0

[transports.sim]
kind = "sim"
timeout_ms = 2000

[drivers.sim]
kind = "sim_integrated"
transport = "sim"
roles = ["positioner", "source", "acquirer", "detector_control", "beam_blank"]
channels = ["Faraday", "SEM"]
move_time_ms = 200

[magnet]
positioner = "sim"
native_axis = "dac"
limits = { min = 0.0, max = 10.0 }
settle_ms = 500
field_table = "sft"
propagate = false
corrections = { deflection = true, hv = true }
protection = { detectors = ["SEM"], beam_blank_threshold = 0.5 }

[source]
driver = "sim"
nominal_hv = 4500

[acquisition]
acquirers = ["sim"]
stale_frame_guard = true
timeout_factor = 2.0

[detector_control]
driver = "sim"

[[detectors]]
name = "Faraday"
kind = "faraday"
channel = "sim:Faraday"
units = "fA"
saturation = 4.9e6

[[detectors]]
name = "SEM"
kind = "counter"
channel = "sim:SEM"
units = "cps"
protection = { threshold = 5e5, on_move = true }
