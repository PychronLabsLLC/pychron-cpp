# Example extraction line (spec section 5.1). Every transport is `sim`, so the
# identical binaries run with no hardware; switch `kind` (and add port/host)
# to drive a real line. Drawn by canvas.toml in this directory.

[system]
name = "example"
scan_interval_ms = 1000

# Optional. With no `dir` there is no file sink. Levels: trace|debug|info|warn|error.
[logging]
# dir = "~/pychron-logs"
# max_size_mb = 10
# max_files = 5
default_level = "info"
# echo_stderr = false

# Per-logger overrides, by name glob. Each transport logs its bytes at trace
# to "<transport name>.wire" (e.g. "valve_bus.wire"), so this shows all wire
# traffic; "scheduler" and "extraction_line" are the line's own loggers.
# [logging.levels]
# "*.wire" = "trace"
# "scheduler" = "debug"

# What the simulated lab behind the `kind = "sim"` transports is like (its
# pressures, pump speeds, the gas in the tank) is in sim.toml beside this
# file, if there is one. To name another:
# [sim]
# file = "sim.toml"

[transports.valve_bus]
kind = "sim"
timeout_ms = 500

[transports.gauge_net]
kind = "sim"
timeout_ms = 500

# The laser PC. With kind = "sim" the Chromium driver talks to a simulated
# Chromium; a real one is kind = "tcp" (see laser.chromium.toml.example).
[transports.laser_pc]
kind = "sim"
timeout_ms = 2000

[drivers.actuator1]
kind = "proxr_relay"
transport = "valve_bus"

[drivers.ig_controller]
kind = "pfeiffer_maxigauge"
transport = "gauge_net"
channels = [1, 2]

# An extraction device: a queue's extract_device = "co2" means this driver.
# Trays are in tray_maps/, their place on this stage in stage_calibrations/.
[drivers.co2]
kind = "chromium"
transport = "laser_pc"

[[valves]]
name = "A"
description = "Furnace to prep"
actuator = "actuator1"
address = "1"
interlocks = ["C"]           # never expose the furnace to an open turbo line
settle_ms = 500

[[valves]]
name = "B"
description = "Prep to spectrometer"
actuator = "actuator1"
address = "2"

[[valves]]
name = "C"
description = "Prep to turbo"
actuator = "actuator1"
address = "3"
interlocks = ["A"]

[[valves]]
name = "P1"
description = "Air pipette inner"
actuator = "actuator1"
address = "4"
interlocks = ["P2"]          # pipette: inner and outer never open together

[[valves]]
name = "P2"
description = "Air pipette outer"
actuator = "actuator1"
address = "5"
interlocks = ["P1"]

[[manual_valves]]
name = "M1"
description = "Turbo to roughing pump"

[[switches]]
name = "pump_power"
description = "Turbo pump controller enable"
actuator = "actuator1"
address = "9"

[[gauges]]
name = "IG1"
driver = "ig_controller"
channel = 1
units = "torr"
alarm_high = 1e-4

[[gauges]]
name = "PG1"
driver = "ig_controller"
channel = 2
units = "torr"

[[pipettes]]
name = "air"
inner = "P1"
outer = "P2"

# Lab-specific names measurement plans reference as '@key' (experiment spec
# 4.1), so one shipped template serves every line of an instrument family.
[aliases]
valves.inlet = "B"           # prep -> spectrometer
valves.outlet = "C"          # prep -> turbo
extraction.eqtime = 20       # seconds of equilibration
