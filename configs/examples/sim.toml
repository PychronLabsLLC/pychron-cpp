# The numbers of the simulated lab behind extraction_line.toml's `kind = "sim"`
# transports. Optional: found by this name beside extraction_line.toml, or
# named there with
#
#   [sim]
#   file = "sim.toml"
#
# What each stage of canvas.toml is to the gas comes from its `kind`: a pump
# pumps, a getter takes active gas, a tank starts full of air, a pipette is a
# small volume between its two valves, and the spectrometer is the source the
# beam reads. This file only changes numbers, for the whole line or by name.
#
# Every key is below with its unit, what it means and its default, each
# commented out; the few numbers this example lab sets for itself are at the
# end, with why. To set another, put it there: its key under its [section]
# (a section may be given only once). What is in force is the simulator's
# built-in defaults, then whatever the program that loads the line sets
# itself, then the keys present here.
#
# Names are canvas.toml's (and gauges of extraction_line.toml that are not on
# the canvas). An unknown name or key, or a number no line can have, stops
# the line from loading, with the file, the line and the key.
#
# Units: pressure mbar, size cc, conductance and pump speed L/s, gas given
# off mbar L / s, time s. Gas is six species: Ar36 Ar37 Ar38 Ar39 Ar40 and
# `active`, everything a getter removes (air is about 1 % argon).

# [defaults]
# pressure = 1e-8            # mbar, as air: what every volume not listed below starts at
# volume_cc = 50             # cc: a stage the canvas gives no `volume`
# pipe_cc = 1                # cc: the pipe between two valves the canvas joins directly
# gauge_cc = 1               # cc: a gauge, on the canvas or off it
# valve_conductance = 0.1    # L/s for Ar40 (lighter gas is faster): two volumes equilibrate
#                            # through a valve with tau = V1 V2 / ((V1 + V2) C)
# outgassing = 5e-13         # mbar L / s of Ar40 given off by the walls, per litre of volume;
#                            # Ar36 and Ar38 follow as in air: the blank. The walls give off
#                            # active gas as well, far more of it, and that has no key: it is
#                            # what a gauge on a volume shut off from its pumps sees rise
# noise = 0.01               # relative 1-sigma noise on every gauge reading
# seed = 0x5eed              # of that noise: the same seed, the same readings

# Named compositions, as ratios to Ar36; a species not given is 0. `air`
# (40/36 298.56, 38/36 0.1885, active 106 times the argon) and `cocktail` are
# built in; a table here of either name replaces it. Any number of others may
# be added and named by a volume below.
# [compositions.cocktail]
# Ar36 = 1
# Ar37 = 0.5
# Ar38 = 0.1885
# Ar39 = 20
# Ar40 = 298.56
# active = 0

# What one volume holds and is. All keys are optional.
#   composition  "air", "cocktail" or a [compositions.*] name (air if not given)
#   argon40      mbar of Ar40; the rest follows the composition
#   pressure     mbar in all, in the composition's proportions (instead of argon40)
#   leak         mbar L / s of Ar40 leaking in as air
#   volume_cc    cc, over the canvas's `volume`
# The pipe between two valves joined directly is a volume too, named for the
# two in byte order (capitals before small letters): [volumes."V1~V2"].
# [volumes.air_tank]
# composition = "air"
# argon40 = 3e-5             # mbar of Ar40: what a tank starts with unasked

# [volumes.prep]
# pressure = 1e-8            # mbar in all, as air

# [volumes.bone]
# leak = 0                   # mbar L / s of Ar40, as air: a leaking stage is a blank that will not come down

# [volumes.air]
# volume_cc = 0.1            # cc: what a pipette is unless the canvas sizes it;
#                            # one shot is the tank's pressure times this

# [valves.B]
# conductance = 0.1          # L/s for Ar40: the inlet; a smaller one equilibrates more slowly

# A pump on a volume. A stage of kind "pump" has one unasked; a section here
# changes it, or puts a pump on any other volume. A key left out is as it was.
# [pumps.turbo]
# speed = 50                 # L/s
# base = 1e-9                # mbar: the pressure it ends at

# [pumps.rough]
# speed = 50                 # L/s
# base = 1e-9                # mbar

# The ion source: the stage of kind "spectrometer".
# [spectrometer]
# sensitivity = 1e12         # fA of beam per mbar of an isotope in the source
# consumption = 2e-5         # 1/s: the fraction of each argon the source uses up a second
# memory_fA_per_s = 0.01     # fA/s: what the source gives back, as a rise of the Ar40 beam

# A detector of the simulated spectrometer, by its name there.
# [detectors.H1]
# baseline = 0               # fA (cps on a counting detector): what it reads with no beam on it
# baseline_drift_per_h = 0   # the same, per hour

# ---------------------------------------------------------------------------
# What this example lab sets, so that experiment.sim-air.toml (blank, air,
# air, air, blank) reads like a lab: an air shot of about 9.5e4 fA of Ar40
# that the source uses up at 1.9 fA/s, a blank of about 10 fA, an inlet whose
# rise can be seen, and a source that pumps back to nothing. Everything above
# is commented out; these are in force.

[defaults]
pressure = 1e-10           # the lab starts pumped down: every volume at the turbo's base,
                           # which is how each run's pump-out leaves prep and the source
outgassing = 1.5e-13       # 0.15 fA/s of Ar40 in any static volume. A blank is static for
                           # about a minute before its time zero: about 10 fA. With the
                           # memory (0.01 fA/s) that is a twelfth of what the source
                           # uses of an air shot, so an air shot's signal falls

[volumes.air_tank]
argon40 = 9.5e-5           # one 0.1 cc pipette of it, spread over prep and the source
                           # (50 cc each), is 9.5e-8 mbar: 9.5e4 fA of Ar40 on a Faraday
                           # and 317 fA (cps) of Ar36 on the counter. Each shot leaves
                           # the 50 cc tank at 50 / 50.1 of what it was

[valves.B]
conductance = 0.02         # the inlet: prep and the source equilibrate with
                           # tau = 50 cc * 50 cc / (100 cc * 0.02 L/s) = 1.25 s, which a
                           # 1 s sniff can follow; extraction_line.toml's 20 s of
                           # equilibration is 16 of them. Pumping the source out through
                           # it and prep takes about 3 s a time constant

[pumps.turbo]
base = 1e-10               # mbar in all, 0.93 % of it Ar40, which is 0.93 fA. A source
                           # pumped through the inlet ends 0.4 fA above that (its walls
                           # against the inlet's conductance): inside the 1 fA noise of
                           # a Faraday. At the default 1e-9 it would read 9.7 fA
