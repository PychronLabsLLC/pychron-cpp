# The camera of each extraction device (the driver's name in
# extraction_line.toml). With one, a hole move that asks for it (a script's
# move_to_position() does by default) ends by centering the hole under the
# beam: the stage waits, the camera looks, the stage is nudged, until the hole
# is in place. What is found is kept per hole in stage_corrections/ and used
# as the start of the next move there. A device with no table here has no
# camera and goes to its calibrated positions, as before.

[co2]
# sim: the tray as a camera would see it from the simulated stage.
# recorded: a folder of recorded frames (frames = "recordings/..."), for
# looking at what the finder sees (`elctl laser look`); it does not follow
# the stage.
# opencv: a real camera, or a video file (see [co2.opencv] below).
# pylon: a Basler GigE or USB3 camera (see [co2.pylon]); read and checked
# here, but its driver is not part of this build yet.
source = "sim"
# center: the camera may center holes and follow the glow. A live camera
# does that only over a real laser, a simulated one only over a simulated
# laser.
# view: a picture only. Nothing it sees moves the stage, and queues run
# uncentered. To try this computer's own camera in the laser window, set
#   source = "opencv"
#   use = "view"
# (`elctl laser cameras` lists what there is; macOS asks once whether
# Pychron may use the camera).
use = "center"
px_per_mm = 23.0
# which way the picture moves when the stage does: the usual camera shows
# stage +x as image +x and stage +y as image up (flip_y)
flip_x = false
flip_y = true
aim_offset_px = [0, 0]    # the beam's place in the picture, from its center
settle_ms = 200           # after a move, before a frame is trusted

# px_per_mm and the flips can be measured instead of typed, with a hole
# under the aim point: `elctl laser camera-scale co2 <tray> <hole>`, or
# Measure camera scale in the laser window. What is measured is kept in
# camera_scales/co2.toml and used instead of the values here.

[co2.opencv]
device = 0                # a camera's index, or a video file's name
# width = 1280            # asked of the camera; left out: its own
# height = 720
# fps = 30
channel = "luma"          # luma | r | g | b
rotate = 0                # 0 | 90 | 180 | 270, clockwise
# roi = [0, 0, 640, 480]  # x, y, w, h: a part of the frame
timeout_ms = 1000         # how long anything waits for a frame

[co2.pylon]
serial = ""               # empty: the first camera found
exposure_us = 10000
gain_db = 0
pixel_format = "Mono8"
packet_size = 1500        # GigE: 1500, or more with jumbo frames end to end
timeout_ms = 1000

[co2.sim]
# how far the real tray is from where its calibration says: what autocenter
# has to find
tray_error_mm = [0.15, -0.10]
noise = 0.01
# "machined": the tray as stainless steel, its holes lit from one side
# surface = "machined"
# while the simulated laser fires the camera sees the sample glow: this far
# from its hole's center, creeping this fast as it is heated (what a
# dragonfly pattern follows)
grain_offset_mm = [0.2, 0.1]
glow_drift_mm_per_s = [0.0, 0.0]

# A grain that heats under the beam, flares, wanders and jumps, instead of
# the steady glow above (glow_sigma_mm and glow_drift_mm_per_s then cannot be
# set; grain_offset_mm still places the grain). Every key is optional and its
# default is off. The numbers are judgement, not measurement: they test a
# tracker against stated behaviour, they prove nothing about a real grain.
# [co2.sim.grain]
# beam_radius_mm = 0.4             overlap's width
# reference_output_percent = 20    output where heat reaches 1
# heat_tau_s = 0.5                 lag rising
# cool_tau_s = 1.0                 lag falling
# glow_exponent = 4                how steeply glow follows heat
# glow_peak = 0.6                  peak at heat 1
# lobes = 1                        lobe slots, 1 to 16
# lobe_sigma_mm = 0.3              size of one lobe
# lobe_spread_mm = 0               how far lobes sit from the grain's center
# grain_radius_mm = 0              grain's size (radius of equal area), 0 to 100; 0: a point
# grain_sides = 6                  corners of its outline, 3 to 16
# grain_irregularity = 0.3         how far a corner strays, 0 to 0.6
# body_glow = 0.4                  share of brightness over the whole grain, 0 to 1
# melt_mm_per_s = 0                radius lost a second at full heat; 0: no melting
# min_radius_mm = 0.1              radius melting stops at
# lobe_wander_mm_per_rt_s = 0      a lobe's random walk
# lobe_life_s = 0                  mean life of a lobe; 0: they never die
# flicker = 0                      brightness's slow flutter, 0 to 1
# flicker_tau_s = 0.3
# flares_per_s = 0                 mean rate of flares
# flare_gain = 3                   brightness multiple at a flare's top
# flare_tau_s = 0.3
# dropouts_per_s = 0               mean rate of the glow going dark
# dropout_s = 0.5                  how long dark
# creep_mm_per_s = [0, 0]          steady creep at heat 1
# wander_mm_per_rt_s = 0           the grain's random walk at heat 1
# jumps_per_s = 0                  mean rate, while heat is 0.5 or more
# jump_mm = 0.3                    mean size of a jump

[co2.autocenter]
tolerance_mm = 0.03
max_iterations = 4
max_step_mm = 0.5
frames_per_step = 3
# continue: carry on at the calibrated position when the hole cannot be
# centered (as legacy pychron). fail: the move is an error and the run stops
# before the laser is fired.
on_failure = "continue"
