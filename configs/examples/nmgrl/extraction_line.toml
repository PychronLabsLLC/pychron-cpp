# Notes from the conversion:
#   check_actuation_delay not carried over (8 valves: FD, FA, FB, FC, FH, FG, FE, FF)
#   check_actuation_enabled not carried over (1 valve: R)
#   query_state="false" not carried over (33 valves: FD, FA, FB, FC, FH, FG, FE, FF, ...)
#   canvas: tee R-JanNP10-MSManual: end offset not carried over
#   canvas: tee ADiode-Diode-RDiode: end offset not carried over
#   actuator furnace_switch_controller (NMGRLFurnaceActuator): no pychron-cpp driver yet; simulated by sim_valves
#   actuator switch_controller (AgilentGPActuator): no pychron-cpp driver yet; simulated by sim_valves
#   actuator arduino_valve_controller (ArduinoGPActuator): no pychron-cpp driver yet; simulated by sim_valves
#   actuator felix_helix_valve_controller (ObamaQtegraGPActuator): no pychron-cpp driver yet; simulated by sim_valves
#   actuator jan_argus_valve_controller (JanQtegraGPActuator): no pychron-cpp driver yet; simulated by sim_valves
#   canvas: manual_valve MiniboneManual_Rough is not in the valve file; dropped
#   canvas: 5 gauges drawn for illustration, with no reading (legacy gauge controllers are not imported): FBTurbo IG, FATurbo IG, Microbone IG, Roughing IG, Bone IG
#   canvas: connection MiniboneManual_Rough-Minibone names an element that is not drawn; dropped
