# The NMGRL valve box: a real, full-size extraction line (33 valves on five
# controllers, furnace, two bones, pipettes), converted from its legacy Pychron
# setupfiles with `elctl import-line`. Every controller is simulated, so it runs
# with no hardware: `pychron-ui extraction_line.toml canvas.toml` from this directory.
# Drawn by canvas.toml in this directory.
#
# Converted from a legacy Pychron setup (setupfiles) by pychron setup.
# Read: extractionline/valves.xml, canvas2D/canvas.xml, canvas2D/canvas_config.xml, devices/furnace_switch_controller.cfg, devices/NMGRLFurnaceActuator.cfg, devices/switch_controller.cfg, devices/AgilentGPActuator.cfg, devices/arduino_valve_controller.cfg, devices/ArduinoGPActuator.cfg, devices/felix_helix_valve_controller.cfg, devices/ObamaQtegraGPActuator.cfg, devices/jan_argus_valve_controller.cfg, devices/JanQtegraGPActuator.cfg
# Review before running on hardware: the notes at the end say what was not carried over.

[system]
name = "nmgrl_valve"
scan_interval_ms = 1000

# legacy NMGRLFurnaceActuator: pychron-cpp has no driver for it yet; simulated
[transports."furnace_switch_controller"]
kind = "sim"
timeout_ms = 2000

[drivers."furnace_switch_controller"]
kind = "sim_valves"
transport = "furnace_switch_controller"

# legacy AgilentGPActuator: pychron-cpp has no driver for it yet; simulated
[transports."switch_controller"]
kind = "sim"
timeout_ms = 2000

[drivers."switch_controller"]
kind = "sim_valves"
transport = "switch_controller"

# legacy ArduinoGPActuator: pychron-cpp has no driver for it yet; simulated
[transports."arduino_valve_controller"]
kind = "sim"
timeout_ms = 2000

[drivers."arduino_valve_controller"]
kind = "sim_valves"
transport = "arduino_valve_controller"

# legacy ObamaQtegraGPActuator: pychron-cpp has no driver for it yet; simulated
[transports."felix_helix_valve_controller"]
kind = "sim"
timeout_ms = 2000

[drivers."felix_helix_valve_controller"]
kind = "sim_valves"
transport = "felix_helix_valve_controller"

# legacy JanQtegraGPActuator: pychron-cpp has no driver for it yet; simulated
[transports."jan_argus_valve_controller"]
kind = "sim"
timeout_ms = 2000

[drivers."jan_argus_valve_controller"]
kind = "sim_valves"
transport = "jan_argus_valve_controller"

