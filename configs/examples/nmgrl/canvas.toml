# Canvas of the NMGRL valve box (extraction_line.toml in this directory).
# Converted from a legacy Pychron canvas by pychron setup: positions rescaled from
# world units to pixels. Then tools/rebuild_nmgrl_example.py trimmed the empty
# margins above and below and squeezed the vertical spacing to 88%, so `elctl
# import-line` alone no longer reproduces this file.

[canvas]
origin = [0, 0]
size = [1000, 817]
connection_width = 5
# A region of the line takes the colour of the source connected to it with
# the highest precedence (as in legacy pychron): turbo and ion pump 120,
# tank 110, pipette and laser 100, spectrometer 80, getter 70. Each tank has
# a colour of its own, and what is open to a tank wears it. A stage's
# `symbol` or `kind` says what it is; `precedence = <n>` and
# `color = "#rrggbb"` on a stage override. Bone, Minibone and Microbone are
# plain volumes: neutral until something is open to them.
# an open valve wears the colour of the region it joins (default: "green")
open_valve_color = "inherit"

