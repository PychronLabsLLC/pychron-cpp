# Canvas of the NMGRL valve box (extraction_line.toml in this directory).
# Converted from a legacy Pychron canvas by pychron setup: positions rescaled from
# world units to pixels. Then tools/rebuild_nmgrl_example.py trimmed the empty
# margins above and below and squeezed the vertical spacing to 88%, so `elctl
# import-line` alone no longer reproduces this file.

[canvas]
origin = [0, 0]
size = [1000, 796]
connection_width = 5
# an open valve wears the colour of the region it joins (default: "green")
open_valve_color = "inherit"

