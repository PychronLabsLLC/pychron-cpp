# Cooling: the grain heats slowly, cools quickly and creeps while it is hot,
# so a beam that falls behind sees the glow go dim. Stresses the tracker's
# recovery from a dim grain. Slower heating than here (heat_tau_s of 0.8) and
# the first search leaves the grain before the glow has built.
#
# Run: elctl laser track configs/examples/track/cooling.toml
# The model's numbers are judgement, not measurements: this compares tracker
# settings against each other and says nothing about real grains.

output_percent = 20
duration = 30
seeds = 20

[grain]
heat_tau_s = 0.7
cool_tau_s = 0.3
creep_mm_per_s = [0.25, 0.1]
wander_mm_per_rt_s = 0.05

# The settings compared; add keys to [sweep.pattern], [sweep.grain] or
# [sweep.camera] to compare more, each value a run on the same seeds.
[sweep.pattern]
aggressiveness = [0.5, 1, 2]
