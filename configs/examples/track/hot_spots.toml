# Hot spots: the glow is several lobes that wander and die, so its brightest
# point is not the grain's center. Stresses the finder's choice of target and
# the size of the move taken from it.
#
# Run: elctl laser track configs/examples/track/hot_spots.toml
# The model's numbers are judgement, not measurements: this compares tracker
# settings against each other and says nothing about real grains.

output_percent = 20
duration = 30
seeds = 20

[grain]
lobes = 3
lobe_sigma_mm = 0.25
lobe_spread_mm = 0.3
lobe_wander_mm_per_rt_s = 0.1
lobe_life_s = 5

# The settings compared; add keys to [sweep.pattern], [sweep.grain] or
# [sweep.camera] to compare more, each value a run on the same seeds.
[sweep.pattern]
aggressiveness = [0.5, 1, 2]
