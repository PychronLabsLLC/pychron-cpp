# Steady: a grain that glows evenly, stays put and heats with the beam. The
# baseline: what the tracker costs when nothing goes wrong. Stresses nothing.
#
# Run: elctl laser track configs/examples/track/steady.toml
# The model's numbers are judgement, not measurements: this compares tracker
# settings against each other and says nothing about real grains.

output_percent = 20
duration = 30
seeds = 20

[grain]
# no behaviours: every key at its default

# The settings compared; add keys to [sweep.pattern], [sweep.grain] or
# [sweep.camera] to compare more, each value a run on the same seeds.
[sweep.pattern]
aggressiveness = [0.5, 1, 2]
