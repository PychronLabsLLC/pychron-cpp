# The virtual box's Prometheus. The job is the one a real box gets
# (../prometheus/pychron.scrape.yml): same name, same interval. Only where
# the targets come from differs: a file, so they can change without a restart.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: pychron
    scrape_interval: 15s
    file_sd_configs:
      - files:
          - /etc/prometheus/targets.yml
        refresh_interval: 30s
