# Add this job under `scrape_configs:` in the box's prometheus.yml, then
# reload Prometheus. One entry in `static_configs` per instrument computer.
#
#   INSTRUMENT_PC    the instrument computer's address on the lab network
#   INSTRUMENT_NAME  how the dashboards name it, e.g. "argus"
#
# The job must be called `pychron`: the alert rule looks for it by that name.
- job_name: pychron
  scrape_interval: 15s
  static_configs:
    - targets: ["INSTRUMENT_PC:9464"]
      labels:
        instrument: "INSTRUMENT_NAME"
